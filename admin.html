<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>NUTRIBOX Admin - Orders</title>
    <style>
      body{font-family:system-ui,Segoe UI,Roboto,Helvetica,Arial;background:#f7fafc;padding:20px}
      .card{background:#fff;border:1px solid #e5e7eb;padding:12px;border-radius:8px;margin-bottom:10px}
      .muted{color:#6b7280;font-size:0.9rem}
      h1{margin-bottom:12px}
      pre{white-space:pre-wrap}
    </style>
  </head>
  <body>
    <h1>NUTRIBOX — Admin Orders</h1>
    <button id="refresh">Refresh</button>
    <div id="status" class="muted">Loading...</div>
    <div id="orders"></div>

    <script>
      // admin.js inline: fetch orders from backend and render simple list
      const ordersEl = document.getElementById('orders');
      const statusEl = document.getElementById('status');
      document.getElementById('refresh').addEventListener('click', loadOrders);

      async function loadOrders() {
        statusEl.textContent = 'Fetching orders...';
        ordersEl.innerHTML = '';
        try {
          const res = await fetch('http://localhost:5000/api/orders');
          if (!res.ok) throw new Error('Failed to fetch orders');
          const data = await res.json();
          statusEl.textContent = `Found ${data.length} orders`;

          if (data.length === 0) {
            ordersEl.innerHTML = '<div class="card">No orders yet.</div>';
            return;
          }

          data.forEach(order => {
            const d = new Date(order.createdAt || order.created || Date.now());
            const div = document.createElement('div');
            div.className = 'card';
            div.innerHTML = `
              <div style="display:flex;justify-content:space-between;align-items:center">
                <strong>Order ${order._id}</strong>
                <span class="muted">${d.toLocaleString()}</span>
              </div>
              <div class="muted">Customer: ${order.customerName || 'Guest'}</div>
              <div style="margin-top:8px"><strong>Items:</strong>
                <ul>
                  ${order.items.map(i=>`<li>${i.quantity} × ${i.name} (${i.protein||0}g protein, ${i.calories||0} cal)</li>`).join('')}
                </ul>
              </div>
              <div class="muted">Boxes: ${order.totalBoxes} • Protein: ${order.totalProtein} • Calories: ${order.totalCalories}</div>
              <details style="margin-top:8px"><summary>Raw payload</summary><pre>${JSON.stringify(order,null,2)}</pre></details>
            `;
            ordersEl.appendChild(div);
          });
        } catch (err) {
          statusEl.textContent = 'Error: ' + err.message;
          ordersEl.innerHTML = '';
        }
      }

      // Load on page open
      loadOrders();
    </script>
  </body>
</html>
